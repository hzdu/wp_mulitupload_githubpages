name: 扫描 ZIP 文件生成 plugins.json

on:
  # 每次推送到 main 都重新生成
  push:
    branches: main
  # 保留定时执行作为兜底（UTC 时间 0,3,6,9,12,15,18,21 点）
  schedule:
    - cron: '0 */3 * * *'
  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: write

# 同一时间只跑一个，避免两次推送并发写回 main 造成 non-fast-forward
concurrency:
  group: scan-plugins-json
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 运行扫描脚本
        run: python scan.py
        env:
          SCAN_DIR: ./plugins
          # 可选：自定义 BASE_URL（例如使用 GitHub Pages 地址）
          # BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: 提交并推送变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins.json
          if git diff --staged --quiet; then
            echo "📭 无变更需要提交"
          else
            git commit -m "🤖 chore: 更新 plugins.json [skip ci]"
            git push
            echo "✅ 已提交并推送"
          fi